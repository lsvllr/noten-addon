# Version setzt die GitHub Action bei jedem Build auf das Tag des Images (sha-<7 Zeichen>).
name: Noten-Tracker
description: Module, LP und Noten pro Studiengang
version: "sha-af381ec"
slug: noten
url: https://github.com/lsvllr/noten-addon
arch:
  - aarch64
  - amd64
image: ghcr.io/lsvllr/noten-tracker
init: false
startup: application
boot: auto
# HA startet das Add-on neu, wenn /healthz nicht mehr antwortet.
watchdog: http://[HOST]:[PORT:8080]/healthz
# Daten in /config (= /addon_configs/ca8dfbf6_noten, per Samba erreichbar): auth.db + users/<id>.db.
# Während der HA-Sicherung kurz stoppen: SQLite wird dann sauber gesichert.
backup: cold
timeout: 20
map:
  - addon_config:rw
# Kein Port nach außen: erreichbar im HA-Netz unter ca8dfbf6-noten:8080, öffentlich über das Cloudflared-Add-on.
options:
  invite_code: ""
schema:
  invite_code: password?
